name: Marketplace monitor

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:            # lets you press "Run workflow" to test

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers which listings were already sent, so you never get the same one twice.
      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: data
          key: seen-none
          restore-keys: seen-

      - name: Check marketplaces
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SEARCHES_JSON: ${{ secrets.SEARCHES_JSON }}
        run: python run_once.py

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: seen-${{ github.run_id }}
